name: Flutter UI checks

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_w4_checks.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter_w4_checks.yml'

permissions:
  contents: read

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: Get packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
